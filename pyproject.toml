[project]
name = "software-factory"
version = "0.2.0"
description = "Generic, local-first, LLM-provider-agnostic AI Software Factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.13",
    "typer>=0.27",
    "rich>=15.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "langchain-core>=1.6",
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "markdown-it-py>=4.2",
]

[project.scripts]
factory = "software_factory.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "respx>=0.23",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["software_factory"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
